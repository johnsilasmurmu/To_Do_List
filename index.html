<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" >
    <link rel="stylesheet" href="/To_Do_List/To-DoTracker/tracker.css">
</head>
<body>
    <h1 class="heading">To-Do List</h1>
    <div class="DateAndDay"></div>
    <form>
        <input type="text" value="Enter Task" class="adding">
        <button class="addTask"><i class="fa-solid fa-plus"></i></button>
        <div class="taskList"></div>
    </form>
    <h2>Your Tasks</h2>
    <div class="taskText">
    </div>
    <script src="/To_Do_List/To-DoTracker/track.js"></script>
</body>
</html>
